[project]
name = "finrecur"
version = "0.1.0"
description = "FinRecur backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "pydantic>=2",
    "pydantic-settings",
    "anthropic",
    "httpx",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finrecur", "api"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)` defaults are the framework's own idiom, not the
# mutable-default footgun B008 warns about.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["finrecur", "api", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

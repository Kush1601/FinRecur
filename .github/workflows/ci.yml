name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finrecur
          POSTGRES_PASSWORD: finrecur
          POSTGRES_DB: finrecur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finrecur"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://finrecur:finrecur@localhost:5432/finrecur
      FINRECUR_DEMO: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend
        run: cd backend && uv sync --frozen
      - name: Install frontend
        run: cd web && npm ci
      - name: Apply schema and seed
        run: cd backend && uv run alembic upgrade head && uv run python ../scripts/seed.py
      - name: Lint and type-check
        run: make lint
      - name: Unit and integration tests
        run: make test
      - name: Evaluation gate
        run: make eval
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            eval_report.json
            eval_report.md

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finrecur
          POSTGRES_PASSWORD: finrecur
          POSTGRES_DB: finrecur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finrecur"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://finrecur:finrecur@localhost:5432/finrecur
      FINRECUR_DEMO: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd backend && uv sync --frozen
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: cd backend && uv run alembic upgrade head && uv run python ../scripts/seed.py
      - run: cd web && E2E=1 npx playwright test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
